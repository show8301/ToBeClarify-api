name: API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ToBeClarify.Api.csproj

      - name: Build
        run: dotnet build ToBeClarify.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ToBeClarify.Api.csproj --configuration Release --no-build --output publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v6
        with:
          name: tobeclarify-api-publish
          path: publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to IIS
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v5

      - name: Download publish artifact
        uses: actions/download-artifact@v6
        with:
          name: tobeclarify-api-publish
          path: ${{ runner.temp }}\tobeclarify-api-publish

      - name: Deploy API files
        shell: powershell
        env:
          ARTIFACT_PATH: ${{ runner.temp }}\tobeclarify-api-publish
          DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH }}
          HEALTH_CHECK_URL: ${{ vars.API_HEALTHCHECK_URL }}
        run: .\scripts\deploy-iis.ps1 -ArtifactPath $env:ARTIFACT_PATH -DeployPath $env:DEPLOY_PATH -HealthCheckUrl $env:HEALTH_CHECK_URL
