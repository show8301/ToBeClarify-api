name: API CI/CD

# API currently has no separate test host. The dev branch remains build-only and
# skips all automated test suites; production files deploy only from main after release.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ToBeClarify.Api.csproj

      - name: Build
        run: dotnet build ToBeClarify.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ToBeClarify.Api.csproj --configuration Release --no-build --output publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v6
        with:
          name: tobeclarify-api-publish
          path: publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to IIS
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v5

      - name: Download publish artifact
        uses: actions/download-artifact@v6
        with:
          name: tobeclarify-api-publish
          path: ${{ runner.temp }}\tobeclarify-api-publish

      - name: Deploy API files
        shell: powershell
        env:
          ARTIFACT_PATH: ${{ runner.temp }}\tobeclarify-api-publish
          BRANCH_REF: ${{ github.ref }}
          PROD_DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH }}
          PROD_HEALTH_CHECK_URL: ${{ vars.API_HEALTHCHECK_URL }}
        run: |
          if ($env:BRANCH_REF -ne 'refs/heads/main') {
            throw "Production deployment is only allowed from refs/heads/main, not $($env:BRANCH_REF)."
          }

          $deployPath = $env:PROD_DEPLOY_PATH
          $healthCheckUrl = $env:PROD_HEALTH_CHECK_URL
          $targetName = 'production'

          if ([string]::IsNullOrWhiteSpace($deployPath) -or [string]::IsNullOrWhiteSpace($healthCheckUrl)) {
            throw "Missing API deployment variables for ${targetName}."
          }

          .\scripts\deploy-iis.ps1 -ArtifactPath $env:ARTIFACT_PATH -DeployPath $deployPath -HealthCheckUrl $healthCheckUrl
